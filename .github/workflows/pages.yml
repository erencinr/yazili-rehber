# main dalına her gönderimde siteyi GitHub Pages'e yayınlar.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Statik site derle
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # Asıl adres atomica.com.tr/yazili; canonical ve sitemap oraya işaret eder.
          NEXT_PUBLIC_SITE_URL: https://atomica.com.tr/yazili
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
